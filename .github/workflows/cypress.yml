# ============================================================
#  Pipeline CI/CD – Tests E2E Cypress
#  Déclenché sur chaque push (main / develop) et Pull Request
# ============================================================

name: Cypress E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:

  # ──────────────────────────────────────────────────────────
  #  JOB 1 : Installation des dépendances (avec cache)
  # ──────────────────────────────────────────────────────────
  install:
    name: 📦 Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10       # annule le job s'il dépasse 10 minutes

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ── CACHE ──────────────────────────────────────────────
      # La clé est basée sur package-lock.json :
      # si les dépendances changent → cache invalidé automatiquement.
      # On cache node_modules ET les binaires Cypress (~200 Mo économisés).
      - name: Cache node_modules + Cypress binaries
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      # npm ci + vérification binaire Cypress uniquement si pas de cache
      - name: Installer les dépendances (npm ci)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Vérifier le binaire Cypress
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npx cypress verify

  # ──────────────────────────────────────────────────────────
  #  JOB 2 : Exécution des tests Cypress
  # ──────────────────────────────────────────────────────────
  cypress-run:
    name: 🧪 Run Cypress Tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 15       # annule si Cypress se bloque

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Restaurer le cache créé par le job install
      - name: Restaurer le cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      # ── EXÉCUTION CYPRESS via l'action officielle ───────────
      # cypress-io/github-action gère nativement le cache, l'install
      # et l'exécution. continue-on-error permet d'uploader les
      # artifacts même si des tests échouent.
      - name: Lancer les tests Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false           # dépendances déjà dans le cache
          browser: electron        # Electron est inclus dans Cypress, pas de DL
          headed: false
        continue-on-error: true

      # ── ARTIFACTS ──────────────────────────────────────────
      # Screenshots : générés automatiquement en cas d'échec de test
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      # Vidéos : enregistrement complet de chaque spec
      - name: Upload vidéos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────
  #  JOB 3 : Rapport de synthèse
  # ──────────────────────────────────────────────────────────
  report:
    name: 📊 Test Report
    runs-on: ubuntu-latest
    needs: cypress-run
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Télécharger les screenshots
        uses: actions/download-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
        continue-on-error: true

      - name: Télécharger les vidéos
        uses: actions/download-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
        continue-on-error: true

      - name: Résumé du pipeline
        run: |
          echo "## Résultat des tests Cypress" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Élément       | Détail |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch        | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit        | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Déclenché par | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SCREENSHOTS=$(find cypress/screenshots -name "*.png" 2>/dev/null | wc -l)
          VIDEOS=$(find cypress/videos -name "*.mp4" 2>/dev/null | wc -l)
          echo "| Screenshots générés | $SCREENSHOTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Vidéos générées     | $VIDEOS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Artifacts disponibles dans l'onglet **Summary** de ce run." >> $GITHUB_STEP_SUMMARY
